# The rows this bundle contributes. Each row is an independent package with
# its own Host and browser half, so the Plugins page gives each one a switch.
#
# A profile's own cordis.patch.yml is applied after every bundle layer, so a
# deployment overrides a row by id without touching this file. Row ids carry the
# `escyezi/` namespace so they cannot collide with another plugin's rows. Both
# rows were formerly bare `dsh-enhance` / `dsh-enhance-plan-x` ids.
- insert:
    - id: escyezi/dsh-enhance-balance
      name: "@escyezi/dsh-enhance-balance"
      config:
        balanceRefreshMs: 60000
    - id: escyezi/dsh-enhance-plan-x
      name: "@escyezi/dsh-enhance-plan-x"
    - id: escyezi/dsh-enhance-source
      name: "@escyezi/dsh-enhance-source"
      config:
        sourcePath: ""
