# Mirrors a DSH profile's own settings: a flat, hoisted node_modules so packages
# whose published manifests leave a browser-only import undeclared still resolve
# in tests.
packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-api-account-controller@0.2.1-rc.2'
  - '@deepseek-ai/dsh-api-remotes@0.2.1-rc.2'
  - '@deepseek-ai/dsh-api-session-controller@0.2.1-rc.2'
  - '@deepseek-ai/dsh-brand@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-locale@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-renderer@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-sidebar@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-slots@0.2.1-rc.2'
  - '@deepseek-ai/dsh-deepseek-account@0.2.1-rc.2'
  - '@deepseek-ai/dsh-deque@0.2.1-rc.2'
  - '@deepseek-ai/dsh-host-webserver@0.2.1-rc.2'
  - '@deepseek-ai/dsh-util-values@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-conversation@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-sidebar-documentpreview@0.2.1-rc.2'
  - '@deepseek-ai/dsh-commands@0.2.1-rc.2'
  - '@deepseek-ai/dsh-fs@0.2.1-rc.2'
  - '@deepseek-ai/dsh-llm@0.2.1-rc.2'
  - '@deepseek-ai/dsh-plan-mode@0.2.1-rc.2'
  - '@deepseek-ai/dsh-session-projection@0.2.1-rc.2'
  - '@deepseek-ai/dsh-session@0.2.1-rc.2'
  - '@deepseek-ai/dsh-timeout@0.2.1-rc.2'
  - '@deepseek-ai/dsh-tools@0.2.1-rc.2'
  - '@deepseek-ai/dsh-typert-protocol@0.2.1-rc.2'
  - '@deepseek-ai/dsh-util-crypto@0.2.1-rc.2'
  - '@deepseek-ai/dsh-util-workspace-path@0.2.1-rc.2'
  - '@deepseek-ai/dsh-working-directory@0.2.1-rc.2'
